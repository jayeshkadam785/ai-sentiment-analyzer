<!DOCTYPE html>
<html>
<head><title>Sentiment Analyzer</title></head>
<body>
<h2>Product Review Sentiment</h2>
<textarea id="input" rows="8" cols="60"
  placeholder="One review per line"></textarea><br>
<button onclick="run()">Analyze</button>
<pre id="output"></pre>
<script>
async function run() {
  const texts = document.getElementById("input").value
                  .split("\n").filter(t => t.trim());
  const res = await fetch("/analyze", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({texts})
  });
  document.getElementById("output").textContent =
    JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
